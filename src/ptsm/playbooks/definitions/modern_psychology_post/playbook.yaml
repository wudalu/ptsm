playbook_id: modern_psychology_post
version: 1
domain: 现代心理困境观察
platforms:
  - xiaohongshu
required_skills:
  - xhs_trend_scan
  - topic_research
  - xhs_image_strategy
  - xhs_human_voice
  - psychology_style
  - psychology_safety
  - xhs_psychology_hashtagging
optional_skills: []
hotspot_routing:
  include_any:
    - 情绪内耗
    - 关系边界
    - 孤独感
    - 短视频焦虑
reflection:
  must_include_phrase: "专业"
  required_hashtag: "#心理学"
  body_must_include_any:
    - 评论区
    - 事实 / 猜测 / 下一步
    - 事实=
    - 存
    - 写下来
    - 备忘录
    - 哪派
    - 三栏
    - 5分钟
    - 边界句
    - 消息草稿
  body_must_not_include_any:
    - 你就是抑郁症
    - 你就是双相
    - 你就是ADHD
    - 人格障碍
    - 治好焦虑
    - 治愈抑郁
    - 用药
    - 停药
    - 想让评论区
    - 想存一组
    - 变体要求
    - 模板要求
    - comment_chain
    - save_tool
    - identity_conflict
  title_must_not_include_any:
    - 不是你
    - 反刍思维
    - 低控制感
    - 边界压力
    - 情绪调节
    - 灾难化思维
    - 心理机制
max_attempts: 3
drafting_model: deepseek-reasoner
trend_keywords:
  - 职场焦虑
  - 情绪内耗
  - 关系边界
  - 孤独感
  - 短视频焦虑
  - 睡眠恢复
