version: 1
suite_id: modern_psychology_post.default
uses:
  final_content: final_content.v1
  artifact: artifact.v1
  skill_activation: skill_activation.v1

quality_judges:
  executor_content_quality:
    evaluator_id: llm.executor.content_quality
    gate_level: required
    enabled_when_requested: true
    note: Required generation gate; failures feed rewrite hints into the next draft before human review.

node_contracts:
  planner:
    output_contract: skill_activation.v1
    required_fields:
      - selected_playbook
      - activated_skills
      - activated_skill_details
      - planner_prompt
      - persona_prompt
    required_skills:
      from_playbook: true
    runtime_context:
      allowed_missing:
        - xhs_trend_scan
        - topic_research
      required_traceability: true

  executor:
    output_schema: final_content.v1
    required_fields:
      - title
      - body
      - image_text
      - hashtags
    constraints:
      title_max_chars: 30
      title_must_not_equal_any:
        - "下班后还在复盘那句话"
      title_must_not_include_any:
        - "心理学小知识"
        - "情绪管理干货"
        - "小红书爆款"
      title_must_include_any:
        - "不是你"
        - "边界"
        - "复盘"
        - "消息"
        - "睡前"
        - "AI"
      image_text_must_not_equal_any:
        - "脑子还没下班"
      hashtags_min_count: 3
      hashtags_max_count: 7
      hashtags_must_include_any:
        - "#心理学"
        - "#情绪管理"
      body_min_chars: 260
      body_max_chars: 620
      body_must_include_any:
        - "反刍思维"
        - "低控制感"
        - "边界"
        - "情绪调节"
      body_must_include_all:
        - "专业帮助"
      body_must_include_comment_prompt_any:
        - "评论区"
        - "你最"
        - "哪类瞬间"
      body_must_include_save_trigger_any:
        - "事实 / 猜测 / 下一步"
        - "三栏"
        - "5分钟"
        - "边界句"
        - "消息草稿"
        - "模板"
      body_must_not_include_any:
        - "诊断"
        - "你就是抑郁症"
        - "你就是双相"
        - "你就是ADHD"
        - "人格障碍"
        - "治好焦虑"
        - "治愈抑郁"
        - "用药"
        - "停药"
        - "变体要求"
        - "comment_chain"
        - "save_tool"
        - "identity_conflict"
      combined_must_not_include_any:
        - "首先"
        - "其次"
        - "最后"
        - "综上"
        - "本文"
        - "作为AI"
        - "建议大家"
        - "小红书爆款"
        - "可复制疯话："
        - "可复制疯话:"
        - "今日可复制疯话："
        - "可复制通勤疯话："
        - "可收藏小结："
        - "可收藏小结:"
        - "可收藏句型："
        - "可保存单元："
        - "可保存单元:"
        - "评论交接："
        - "评论交接:"
        - "可以先收藏清单："
        - "可收藏看球清单："
        - "看球清单可以先收藏："
        - "可保存三步："
        - "可复制疯话"
        - "今日可复制疯话"
        - "可复制通勤疯话"
        - "可收藏小结"
        - "可收藏句型"
        - "可保存单元"
        - "评论交接"
        - "可以先收藏清单"
        - "可收藏看球清单"
        - "看球清单可以先收藏"
        - "可保存三步"

  reflector:
    allowed_decisions:
      - retry
      - finalize
      - fail
    invariants:
      - retry_requires_feedback
      - finalize_requires_passing_required_rules

  finalize:
    artifact_schema: artifact.v1
    required_fields:
      - playbook_id
      - final_content
      - activated_skill_details
      - runtime_skill_details
