suite_id: daily_english_post.default
version: 1
uses:
  artifact: artifact.v1
node_contracts:
  planner:
    required_fields:
      - selected_playbook
      - activated_skills
  executor:
    required_fields:
      - title
      - image_text
      - body
      - hashtags
    constraints:
      title_max_chars: 30
      title_must_not_equal_any:
        - 每日英语单词
        - 今日单词
      image_text_must_not_equal_any:
        - 学一个单词
      hashtags_min_count: 2
      hashtags_max_count: 6
      hashtags_must_include_any:
        - "#每日英语"
      body_min_chars: 180
      body_max_chars: 750
      body_must_include_any:
        - 音标
        - 词性
        - 例句
        - 翻译
      body_must_include_comment_prompt_any:
        - 评论区
        - 造句
        - 你会怎么说
      body_must_include_save_trigger_any:
        - 存
        - 收藏
        - 句型
      body_must_not_include_any:
        - 词典释义
        - 老师讲
        - 课堂作业
        - 变体要求
        - 模板要求
        - comment_chain
        - save_tool
        - identity_conflict
      combined_must_not_include_any:
        - 首先
        - 其次
        - 最后
        - 综上
        - 本文
        - 作为AI
        - 建议大家
        - 小红书爆款
  finalize:
    required_fields:
      - playbook_id
      - final_content
quality_judges:
  executor_content_quality:
    evaluator_id: llm.executor.content_quality
    gate_level: required
    threshold: 0.7
