suite_id: daily_english_post.default
version: 1
uses:
  artifact: artifact.v1
node_contracts:
  planner:
    required_fields:
      - selected_playbook
      - activated_skills
  executor:
    required_fields:
      - title
      - image_text
      - body
      - hashtags
    constraints:
      title_max_chars: 30
      title_must_not_equal_any:
        - 每日英语单词
        - 今日单词
      title_must_not_include_any:
        - 每日英语单词
        - 英语学习干货
        - 万能表达
      image_text_must_not_equal_any:
        - 学一个单词
      hashtags_min_count: 2
      hashtags_max_count: 6
      hashtags_must_include_any:
        - "#每日英语"
      body_min_chars: 180
      body_max_chars: 520
      body_must_include_any:
        - 音标
        - 词性
        - 例句
        - 翻译
      body_must_include_comment_prompt_any:
        - 评论区
        - 造句
        - 你会怎么说
      body_must_include_save_trigger_any:
        - 存
        - 收藏
        - 句型
      body_must_not_include_any:
        - 词典释义
        - 老师讲
        - 课堂作业
        - 变体要求
        - 模板要求
        - comment_chain
        - save_tool
        - identity_conflict
      combined_must_not_include_any:
        - 首先
        - 其次
        - 最后
        - 综上
        - 本文
        - 作为AI
        - 建议大家
        - 小红书爆款
        - "可复制疯话："
        - "可复制疯话:"
        - "今日可复制疯话："
        - "可复制通勤疯话："
        - "可收藏小结："
        - "可收藏小结:"
        - "可收藏句型："
        - "可保存单元："
        - "评论交接："
        - "评论交接:"
        - "可保存单元:"
        - "可以先收藏清单："
        - "可收藏看球清单："
        - "看球清单可以先收藏："
        - "可保存三步："
        - "可复制疯话"
        - "今日可复制疯话"
        - "可复制通勤疯话"
        - "可收藏小结"
        - "可收藏句型"
        - "可保存单元"
        - "评论交接"
        - "可以先收藏清单"
        - "可收藏看球清单"
        - "看球清单可以先收藏"
        - "可保存三步"
  finalize:
    required_fields:
      - playbook_id
      - final_content
quality_judges:
  executor_content_quality:
    evaluator_id: llm.executor.content_quality
    gate_level: required
    threshold: 0.7
