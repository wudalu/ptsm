version: 1
suite_id: fengkuang_daily_post.default
uses:
  final_content: final_content.v1
  artifact: artifact.v1
  skill_activation: skill_activation.v1

quality_judges:
  executor_content_quality:
    evaluator_id: llm.executor.content_quality
    gate_level: required
    enabled_when_requested: true
    note: Required generation gate; failures feed rewrite hints into the next draft before human review.

node_contracts:
  planner:
    output_contract: skill_activation.v1
    required_fields:
      - selected_playbook
      - activated_skills
      - activated_skill_details
      - planner_prompt
      - persona_prompt
    required_skills:
      from_playbook: true
    runtime_context:
      allowed_missing:
        - xhs_trend_scan
      required_traceability: true

  executor:
    output_schema: final_content.v1
    required_fields:
      - title
      - body
      - image_text
      - hashtags
    constraints:
      title_max_chars: 22
      title_must_include_tension_any:
        - 那一秒
        - 那秒
        - 那句
        - 不是
        - 不代表
        - 不想
        - 不急
        - 不能
        - 别
        - 却
        - 反而
        - 突然
        - 原来
        - 为什么
        - 到底
        - 值不值
        - 被
        - 最累
        - 先别
        - 救
        - 硬仗
        - 冷场
        - 改到
        - 拖回
      title_must_not_equal_any:
        - 打工人日常
        - 打工人地铁生存实录
        - 会议连环暴击实录
        - 社畜崩溃边缘实录
        - 职场崩溃实录
      title_must_not_include_any:
        - 实录
        - 日常
        - 今日已疯
        - 发疯文学
      title_must_include_any:
        - 工牌
        - 群聊
        - 周报
        - 早会
        - 下班
        - 领导
        - 物件
      image_text_must_not_equal_any:
        - 今日已疯
        - 脑子已掉线
        - 先别找我
      hashtags_min_count: 1
      hashtags_max_count: 8
      hashtags_must_include_any:
        - "#发疯文学"
      body_min_chars: 120
      body_max_chars: 380
      body_must_include_any:
        - 评论区
        - 接一句
        - 可复制
        - 模板
        - 写在
      body_must_include_comment_prompt_any:
        - 评论区
        - 接一句
        - 你最
      body_must_include_save_trigger_any:
        - 可复制
        - 模板
        - 写在
        - 金句
        - 话术
      body_must_include_scene_signal: true
      body_scene_signal_any:
        - 领导
        - 工牌
        - 群聊
        - 周报
        - 早会
        - 下班
        - 工位
        - 地铁
      body_human_anchor_any:
        - 我
        - 你
        - 我们
        - 今天
        - 刚刚
        - 那一秒
        - 今晚
        - 路上
        - 手边
        - 这句
        - 这个
      body_must_not_include_any:
        - 精神病
        - 心理医生
        - 医院
        - 治疗
        - 用药
        - 变体要求
        - comment_chain
        - save_tool
        - identity_conflict
      combined_must_not_include_any:
        - 首先
        - 其次
        - 最后
        - 综上
        - 本文
        - 作为AI
        - 建议大家
        - 小红书爆款
        - "可复制疯话："
        - "可复制疯话:"
        - "今日可复制疯话："
        - "可复制通勤疯话："
        - "可收藏小结："
        - "可收藏小结:"
        - "可收藏句型："
        - "可保存单元："
        - "评论交接："
        - "评论交接:"
        - "可保存单元:"
        - "可以先收藏清单："
        - "可收藏看球清单："
        - "看球清单可以先收藏："
        - "可保存三步："
        - "可复制疯话"
        - "今日可复制疯话"
        - "可复制通勤疯话"
        - "可收藏小结"
        - "可收藏句型"
        - "可保存单元"
        - "评论交接"
        - "可以先收藏清单"
        - "可收藏看球清单"
        - "看球清单可以先收藏"
        - "可保存三步"
      body_must_include_scene_signal: true

  reflector:
    allowed_decisions:
      - retry
      - finalize
      - fail
    invariants:
      - retry_requires_feedback
      - finalize_requires_passing_required_rules

  finalize:
    artifact_schema: artifact.v1
    required_fields:
      - playbook_id
      - final_content
      - activated_skill_details
      - runtime_skill_details
