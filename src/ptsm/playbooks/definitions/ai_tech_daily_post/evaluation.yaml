suite_id: ai_tech_daily_post.default
version: 1
uses:
  artifact: artifact.v1
node_contracts:
  planner:
    required_fields:
      - selected_playbook
      - activated_skills
  executor:
    required_fields:
      - title
      - image_text
      - body
      - hashtags
    constraints:
      title_max_chars: 32
      title_must_not_equal_any:
        - AI科技资讯
        - 今日AI新闻
      title_must_not_include_any:
        - AI科技资讯
        - 今日AI新闻
        - 科技速递
      title_must_include_any:
        - AI
        - 普通人
        - 搭子
        - 工具
        - 更新
      image_text_must_not_equal_any:
        - AI又更新了
      hashtags_min_count: 2
      hashtags_max_count: 6
      hashtags_must_include_any:
        - "#AI资讯"
      body_min_chars: 220
      body_max_chars: 650
      body_must_include_any:
        - 是什么
        - 为什么重要
        - 普通人
      body_must_include_comment_prompt_any:
        - 评论区
        - 你会用吗
        - 你怎么看
      body_must_include_save_trigger_any:
        - 收藏
        - 清单
        - 记住
      body_must_not_include_any:
        - 暴富
        - 收益承诺
        - 买入建议
        - 梭哈
        - 变体要求
        - 模板要求
        - comment_chain
        - save_tool
        - identity_conflict
      combined_must_not_include_any:
        - 首先
        - 其次
        - 最后
        - 综上
        - 本文
        - 作为AI
        - 建议大家
        - 小红书爆款
        - "可复制疯话："
        - "可复制疯话:"
        - "今日可复制疯话："
        - "可复制通勤疯话："
        - "可收藏小结："
        - "可收藏小结:"
        - "可收藏句型："
        - "可保存单元："
        - "评论交接："
        - "评论交接:"
        - "可保存单元:"
        - "可以先收藏清单："
        - "可收藏看球清单："
        - "看球清单可以先收藏："
        - "可保存三步："
        - "可复制疯话"
        - "今日可复制疯话"
        - "可复制通勤疯话"
        - "可收藏小结"
        - "可收藏句型"
        - "可保存单元"
        - "评论交接"
        - "可以先收藏清单"
        - "可收藏看球清单"
        - "看球清单可以先收藏"
        - "可保存三步"
  finalize:
    required_fields:
      - playbook_id
      - final_content
quality_judges:
  executor_content_quality:
    evaluator_id: llm.executor.content_quality
    gate_level: required
    threshold: 0.7
