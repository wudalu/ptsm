suite_id: ai_tech_daily_post.default
version: 1
uses:
  artifact: artifact.v1
  ai_tech_evidence_receipt: ai_tech_evidence_receipt.v1
node_contracts:
  planner:
    required_fields:
      - selected_playbook
      - activated_skills
  executor:
    required_fields:
      - title
      - image_text
      - body
      - hashtags
    constraints:
      # The receipt evaluator owns the three mode-specific evidence shapes.
      # Keep this layer limited to short, reader-visible structural checks so
      # a news brief or fact translation is never forced into a fake test or
      # generic engagement template.
      title_max_chars: 22
      title_must_not_equal_any:
        - AI科技资讯
        - 今日AI新闻
      title_must_not_include_any:
        - AI科技资讯
        - 今日AI新闻
        - 科技速递
      image_text_must_not_equal_any:
        - AI又更新了
      hashtags_min_count: 1
      hashtags_max_count: 6
      hashtags_must_include_any:
        - "#AI资讯"
      body_min_chars: 40
      body_max_chars: 360
      body_must_not_include_any:
        - 暴富
        - 收益承诺
        - 买入建议
        - 梭哈
        - 变体要求
        - 模板要求
        - comment_chain
        - save_tool
        - identity_conflict
        - 万能提示词
        - 直接复制
      combined_must_not_include_any:
        - 首先
        - 其次
        - 最后
        - 综上
        - 本文
        - 作为AI
        - 建议大家
        - 小红书爆款
        - "可复制疯话："
        - "可复制疯话:"
        - "今日可复制疯话："
        - "可复制通勤疯话："
        - "可收藏小结："
        - "可收藏小结:"
        - "可收藏句型："
        - "可保存单元："
        - "评论交接："
        - "评论交接:"
        - "可保存单元:"
        - "可以先收藏清单："
        - "可收藏看球清单："
        - "看球清单可以先收藏："
        - "可保存三步："
        - "可复制疯话"
        - "今日可复制疯话"
        - "可复制通勤疯话"
        - "可收藏小结"
        - "可收藏句型"
        - "可保存单元"
        - "评论交接"
        - "可以先收藏清单"
        - "可收藏看球清单"
        - "看球清单可以先收藏"
        - "可保存三步"
        - 万能提示词
        - 直接复制
  finalize:
    required_fields:
      - playbook_id
      - final_content
      - ai_tech_content_mode
      - ai_tech_evidence_manifest
      - ai_tech_evidence_gate
quality_judges:
  executor_content_quality:
    evaluator_id: llm.executor.content_quality
    gate_level: required
    threshold: 0.7
