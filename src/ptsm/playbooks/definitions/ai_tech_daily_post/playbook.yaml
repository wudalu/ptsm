playbook_id: ai_tech_daily_post
version: 1
domain: AI科技资讯
platforms:
  - xiaohongshu
required_skills:
  - xhs_trend_scan
  - topic_research
  - xhs_image_strategy
  - xhs_human_voice
  - ai_tech_style
  - ai_tech_hashtagging
optional_skills: []
ai_content_policy:
  allowed_modes:
    - news_brief
    - hands_on
    - fact_translation
  news_item_count:
    min: 3
    max: 5
  hands_on_required_fields:
    - product
    - version
    - tested_at
    - task
    - input_summary
    - observed_output
    - limitation
  fact_translation_required_fields:
    - facts
    - who_should_care
    - who_can_wait
hotspot_routing:
  include_any:
    - OpenAI
    - ChatGPT
    - Claude
    - 大模型
    - AI Agent
    - 提示词
reflection:
  must_include_phrase: ""
  required_hashtag: "#AI资讯"
  # Evidence-mode validation is authoritative. Do not require a generic
  # explanatory or engagement phrase that would force unsupported claims into
  # a short fact card or reproducible test record.
  body_must_include_any: []
  body_must_not_include_any:
    - 暴富
    - 收益承诺
    - 买入建议
    - 梭哈
    - 变体要求
    - 模板要求
    - comment_chain
    - save_tool
    - identity_conflict
    - 万能提示词
    - 直接复制的提示词
