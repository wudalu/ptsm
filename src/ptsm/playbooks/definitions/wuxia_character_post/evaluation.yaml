suite_id: wuxia_character_post.default
version: 1
uses:
  artifact: artifact.v1
node_contracts:
  planner:
    required_fields:
      - selected_playbook
      - activated_skills
  executor:
    required_fields:
      - title
      - image_text
      - body
      - hashtags
    constraints:
      title_max_chars: 22
      title_must_include_tension_any:
        - 那一秒
        - 那秒
        - 那句
        - 不是
        - 不代表
        - 不想
        - 不急
        - 不能
        - 别
        - 却
        - 反而
        - 突然
        - 原来
        - 为什么
        - 到底
        - 值不值
        - 被
        - 最累
        - 先别
        - 救
        - 硬仗
        - 冷场
        - 改到
        - 拖回
      title_must_not_equal_any:
        - 武侠人物评述
        - 令狐冲人物分析
      title_must_not_include_any:
        - 武侠人物评述
        - 人物分析
        - 读书笔记
      title_must_include_any:
        - 令狐冲
        - 黄蓉
        - 郭靖
        - 老款
        - 边界
        - 自由
      image_text_must_not_equal_any:
        - 自由不是不负责
      hashtags_min_count: 3
      hashtags_max_count: 7
      hashtags_must_include_any:
        - "#金庸"
        - "#古龙"
      body_min_chars: 700
      body_max_chars: 1100
      body_must_include_any:
        - 《笑傲江湖》
        - 《射雕英雄传》
      body_must_include_comment_prompt_any:
        - 评论区
        - 你最想聊谁
        - 你怎么看
      body_must_include_save_trigger_any:
        - 截图
        - 记下来
        - 这一句
      body_must_include_scene_signal: true
      body_scene_signal_any:
        - 令狐冲
        - 黄蓉
        - 郭靖
        - 这一段
        - 原文
        - 今天
        - 职场
      body_human_anchor_any:
        - 我
        - 你
        - 我们
        - 今天
        - 刚刚
        - 那一秒
        - 今晚
        - 路上
        - 手边
        - 这句
        - 这个
      body_must_not_include_any:
        - 课堂讲义
        - 百科
        - 变体要求
        - 模板要求
        - comment_chain
        - save_tool
        - identity_conflict
      combined_must_not_include_any:
        - 首先
        - 其次
        - 最后
        - 综上
        - 本文
        - 作为AI
        - 建议大家
        - 小红书爆款
        - "可复制疯话："
        - "可复制疯话:"
        - "今日可复制疯话："
        - "可复制通勤疯话："
        - "可收藏小结："
        - "可收藏小结:"
        - "可收藏句型："
        - "可保存单元："
        - "评论交接："
        - "评论交接:"
        - "可保存单元:"
        - "可以先收藏清单："
        - "可收藏看球清单："
        - "看球清单可以先收藏："
        - "可保存三步："
        - "可复制疯话"
        - "今日可复制疯话"
        - "可复制通勤疯话"
        - "可收藏小结"
        - "可收藏句型"
        - "可保存单元"
        - "评论交接"
        - "可以先收藏清单"
        - "可收藏看球清单"
        - "看球清单可以先收藏"
        - "可保存三步"
  finalize:
    required_fields:
      - playbook_id
      - final_content
quality_judges:
  executor_content_quality:
    evaluator_id: llm.executor.content_quality
    gate_level: required
    threshold: 0.7
