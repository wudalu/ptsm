suite_id: wuxia_character_post.default
version: 1
uses:
  artifact: artifact.v1
node_contracts:
  planner:
    required_fields:
      - selected_playbook
      - activated_skills
  executor:
    required_fields:
      - title
      - image_text
      - body
      - hashtags
    constraints:
      title_max_chars: 34
      title_must_not_equal_any:
        - 武侠人物评述
        - 令狐冲人物分析
      title_must_include_any:
        - 令狐冲
        - 黄蓉
        - 郭靖
        - 老款
        - 边界
        - 自由
      image_text_must_not_equal_any:
        - 自由不是不负责
      hashtags_min_count: 3
      hashtags_max_count: 7
      hashtags_must_include_any:
        - "#金庸"
        - "#古龙"
      body_min_chars: 800
      body_max_chars: 1500
      body_must_include_any:
        - 《笑傲江湖》
        - 《射雕英雄传》
      body_must_include_comment_prompt_any:
        - 评论区
        - 你最想聊谁
        - 你怎么看
      body_must_include_save_trigger_any:
        - 截图
        - 记下来
        - 这一句
      body_must_not_include_any:
        - 课堂讲义
        - 百科
        - 变体要求
        - 模板要求
        - comment_chain
        - save_tool
        - identity_conflict
      combined_must_not_include_any:
        - 首先
        - 其次
        - 最后
        - 综上
        - 本文
        - 作为AI
        - 建议大家
        - 小红书爆款
  finalize:
    required_fields:
      - playbook_id
      - final_content
quality_judges:
  executor_content_quality:
    evaluator_id: llm.executor.content_quality
    gate_level: required
    threshold: 0.7
